name: Notify Site Sync

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/assets/**"
      - "course-config.json"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Request immediate site sync
        env:
          SITE_REPO_DISPATCH_TOKEN: ${{ secrets.SITE_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_REPO_DISPATCH_TOKEN" ]; then
            echo "SITE_REPO_DISPATCH_TOKEN is not configured; scheduled site sync remains enabled."
            exit 0
          fi
          GH_TOKEN="$SITE_REPO_DISPATCH_TOKEN" gh api repos/18287452845/python-notes-site/dispatches \
            -f event_type=content-updated \
            -f client_payload[content_sha]="${{ github.sha }}"
